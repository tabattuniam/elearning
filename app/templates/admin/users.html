{% extends "base.html" %}
{% block title %}Kelola User{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Kelola User</h1>
    <a href="/admin/users/tambah" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">+ Tambah User</a>
</div>
<div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600">
            <tr>
                <th class="text-left px-4 py-3">Nama</th>
                <th class="text-left px-4 py-3">Username</th>
                <th class="text-left px-4 py-3">Role</th>
                <th class="text-left px-4 py-3">Aksi</th>
            </tr>
        </thead>
        <tbody>
        {% for u in users %}
        <tr class="border-t hover:bg-gray-50">
            <td class="px-4 py-3">{{ u.nama }}</td>
            <td class="px-4 py-3 text-gray-500">{{ u.username }}</td>
            <td class="px-4 py-3">
                <span class="px-2 py-0.5 rounded text-xs {% if u.role == 'guru' %}bg-blue-100 text-blue-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ u.role }}
                </span>
            </td>
            <td class="px-4 py-3">
                <a href="/admin/users/{{ u.id }}/hapus"
                   onclick="return confirm('Hapus user {{ u.nama }}?')"
                   class="text-red-500 hover:underline">Hapus</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400">Belum ada user</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
