{% extends "base.html" %}
{% block title %}Tambah Materi{% endblock %}
{% block content %}
<div class="mb-4">
    <a href="/guru/mapel/{{ mapel.id }}" class="text-blue-600 hover:underline text-sm">← Kembali ke {{ mapel.nama }}</a>
</div>
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Tambah Materi</h1>
    <div class="bg-white rounded-xl shadow p-6">
        <form method="post" action="/guru/mapel/{{ mapel.id }}/materi/tambah" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Judul Materi</label>
                <input type="text" name="judul" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Urutan</label>
                <input type="number" name="urutan" value="1" min="1" class="w-32 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Konten / Penjelasan</label>
                <textarea name="konten" rows="8" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none font-mono text-sm" placeholder="Tulis materi di sini..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Upload File (PDF/Gambar, opsional)</label>
                <input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" class="w-full border rounded-lg px-3 py-2">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Simpan</button>
                <a href="/guru/mapel/{{ mapel.id }}" class="text-gray-500 px-4 py-2 rounded-lg hover:bg-gray-100">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
