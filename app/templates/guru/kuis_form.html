{% extends "base.html" %}
{% block title %}Tambah Kuis{% endblock %}
{% block content %}
<div class="mb-4">
    <a href="/guru/mapel/{{ mapel.id }}" class="text-blue-600 hover:underline text-sm">← Kembali ke {{ mapel.nama }}</a>
</div>
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-6">Tambah Kuis</h1>
    <div class="bg-white rounded-xl shadow p-6">
        <form method="post" action="/guru/mapel/{{ mapel.id }}/kuis/tambah" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Judul Kuis</label>
                <input type="text" name="judul" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Deskripsi</label>
                <textarea name="deskripsi" rows="2" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">Lanjut Tambah Soal →</button>
                <a href="/guru/mapel/{{ mapel.id }}" class="text-gray-500 px-4 py-2 rounded-lg hover:bg-gray-100">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
